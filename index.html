<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width: 992px)">
    <link rel="stylesheet" href="estilos/tablet.css" media="screen and (min-width: 768px)">
    <link rel="shortcut icon" href="img/weather-iconnav.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/68415d66c2.js" crossorigin="anonymous"></script>
    <title>EveryClima</title>
</head>
<body class="darkmode">
    <section id="allSection">
        
<header id="ficha">
    <div id="headercll">

        <div id="iconw">
            <img src="img/weather-iconnav.png" alt="EveryClima">
        </div>

        <div id="pesquisa-container">
            <input type="text" id="pesquisa" placeholder="🔎︎ Pesquisar">
        </div>

        <div id="headerMenu">
            <i class="fa-solid fa-bars" id="menuIcon"></i>

            <nav id="menu">
                <ul id="ulFicha">
                    <li><a href="#" id="inicio"><i class="fa-solid fa-house-chimney"></i> Início</a></li>
                    <li><a href="#" id="mapa"><i class="fa-solid fa-map-location-dot"></i> Mapa</a></li>
                    <li><a href="#" id="theme"><i class="fa-solid fa-moon"></i> Theme</a></li>
                    <li><a href="#" id="dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                </ul>
            </nav>
        </div>

    </div> 
</header>
        

        <main id="content">

            <div id="climaPrincipal">
                <div id="cp1">
                    <h2 id="cidade"></h2>
                    <p>Umidade: <span id="umidade"></span>%</p>
                    <h1 id="temperatura"></h1>
                </div>
                <img id="imagemTemp" alt="Ícone do clima">
            </div>

            <div id="forecast-wrapper">
                <button id="btnLeft">◀</button>
                <div id="previsaoProximasHoras">
                    <p><i>Previsão Próximas Horas</i></p>
                    <div id="forecast" class="forecast-container"></div>
                </div>
                <button id="btnRight">▶</button>
            </div>

            <div id="airConditions">
                <p><i>Air Conditions</i></p>
                <div class="conditions">
                    <div class="iconConditions"><i class="fa-solid fa-temperature-high"></i> <p>Sensação Térmica</p></div>
                    <h2><span id="realFeel"></span></h2>
                </div>
                <div class="conditions">
                    <div class="iconConditions"><i class="fa-solid fa-droplet"></i> <p>Umidade</p></div>
                    <h2><span id="umidity"></span></h2>
                </div>
                <div class="conditions">
                    <div class="iconConditions"><i class="fa-solid fa-wind"></i> <p>Vento</p></div>
                    <h2><span id="vento"></span></h2>
                </div>
                <div class="conditions">
                    <div class="iconConditions"><i class="fa-solid fa-cloud-showers-heavy"></i> <p>Chance de Chuva</p></div>
                    <h2><span id="chanceChuva"></span></h2>
                </div>
            </div>

            <div id="previsaoDias">
                <p><i>Pelos Próximos 5 dias</i></p>
                <div class="listaDias"></div>
            </div>
        </main>

    </section>

    <script src="script.js"></script>
</body>
</html>
